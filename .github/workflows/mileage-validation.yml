name: Mileage validation
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: mileage-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  mileage:
    name: Mileage validation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.21.0"
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.3"
      - name: Install immutable dependencies (no lifecycle scripts)
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --ignore-scripts
          npm ci --ignore-scripts --prefix scripts/ci/tooling --no-audit --no-fund
          git diff --exit-code -- package.json bun.lock scripts/ci/tooling/package-lock.json
          node scripts/ci/tooling/node_modules/playwright/cli.js install --with-deps chrome
      - name: Run validation with loopback-only networking
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          uid=$(id -u)
          gid=$(id -g)
          node_bin=$(dirname "$(command -v node)")
          sudo env -i PATH="$node_bin:/usr/local/bin:/usr/bin:/bin" \
            HOME="$HOME" CI=true BASE_SHA="$BASE_SHA" \
            unshare --net bash -c '
              set -euo pipefail
              ip link set lo up
              exec setpriv --reuid="$1" --regid="$2" --init-groups \
                --bounding-set=-all --inh-caps=-all --ambient-caps=-all \
                --no-new-privs bash scripts/ci/validate.sh
            ' isolated "$uid" "$gid"
